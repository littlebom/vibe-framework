services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vibe_dev
      POSTGRES_USER: vibe
      POSTGRES_PASSWORD: vibe
    ports:
      - "5443:5432"
    volumes:
      - vibe_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibe"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  vibe_postgres:
